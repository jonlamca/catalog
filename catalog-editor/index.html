<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The token never leaves for another host: the pages job narrows connect-src to the GitLab URL. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'none'">
<title>Catalog Editor</title>
<script type="module" src="app.js"></script>
<link rel="stylesheet" href="site.css">
<style>
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1.5rem; padding: 1rem; max-width: 110rem; }
  @media (width < 60rem) { main { grid-template-columns: minmax(0, 1fr); } }
  catalog-editor { --ce-accent: var(--accent); --ce-line: var(--line); --ce-field: var(--bg); --ce-muted: var(--muted); --ce-error: var(--error); }
  aside { display: grid; gap: 1rem; align-content: start; }
  #yaml { width: 100%; min-height: 50vh; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; white-space: pre; }
  #issues { margin: 0; padding-left: 1.2rem; font-size: .9rem; }
  #issues .error { color: var(--error); } #issues .warning { color: var(--muted); }
  form { display: grid; gap: .6rem; padding: 1rem; border: 1px solid var(--line); border-radius: 8px; }
  form h2 { font-size: 1rem; margin: 0; }
  form .check { display: flex; gap: .5rem; align-items: center; }
  #result { font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>Catalog Editor <small>catalog-info.yaml for the Developer Portal (Backstage)</small></h1>
  <nav aria-label="Pages"><a href="./" aria-current="page">Editor</a><a href="registry.html">Registry</a></nav>
  <span id="who"></span>
  <button id="signin" hidden>Sign in with GitLab</button>
  <button id="signout" hidden>Sign out</button>
</header>
<div class="bar" id="source" hidden>
  <label>Project
    <input id="project" list="projects" placeholder="Search your GitLab projects" autocomplete="off">
  </label>
  <datalist id="projects"></datalist>
  <label id="branch-pick" hidden>Start from branch
    <select id="branch"></select>
  </label>
</div>
<p id="status" role="status"></p>
<main>
  <catalog-editor id="editor"></catalog-editor>
  <aside>
    <label>catalog-info.yaml
      <textarea id="yaml" spellcheck="false" aria-describedby="issues"></textarea>
    </label>
    <ul id="issues" aria-live="polite"></ul>
    <form id="save" hidden>
      <h2>Save to GitLab</h2>
      <label>Branch (never the default branch)
        <input id="target" list="branches" autocomplete="off" required>
      </label>
      <datalist id="branches"></datalist>
      <label>Commit message <input id="message" required></label>
      <label class="check"><input type="checkbox" id="mr" checked> Open a merge request into <span id="default-branch"></span></label>
      <div><button class="primary" id="save-button">Save</button> <span id="save-why" class="error"></span></div>
      <div id="result" role="status"></div>
    </form>
  </aside>
</main>
</body>
</html>
