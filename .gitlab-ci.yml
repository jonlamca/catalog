# GitLab Pages: the Catalog Editor and Registry, as they are (static files, nothing to build).
# CI/CD variables:
#   GITLAB_OAUTH_CLIENT_ID  the OAuth application's ID: not confidential, scope api, redirect URI <Pages URL>/
#   BACKSTAGE_ORG_GROUP     optional: the group the registry lists, and the prefix Backstage strips from group names
pages:
  script:
    - mkdir public && cp catalog-editor/*.html catalog-editor/*.css catalog-editor/*.js public/ && rm public/catalog.test.js
    - printf '{"url":"%s","clientId":"%s","orgGroup":"%s"}' "$CI_SERVER_URL" "$GITLAB_OAUTH_CLIENT_ID" "$BACKSTAGE_ORG_GROUP" > public/config.json
    - sed -i "s#connect-src 'self' https:#connect-src 'self' $CI_SERVER_URL#" public/*.html   # the token goes only to this GitLab
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
